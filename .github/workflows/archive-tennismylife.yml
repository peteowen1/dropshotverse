name: Archive tennismylife

# The Sackmann lesson, applied before it costs us twice.
#
# Sackmann's repos went 404 on 2026-08-27 mid-project (D-7). We survived only
# because a snapshot happened to be on the laptop, and that snapshot is now
# published as the `sackmann-archive` Release. tennismylife is exactly the same
# shape of risk today: it is the ONLY tour-wide source of serve statistics we
# have, it is fetched live on every run, and nothing anywhere keeps a copy. If
# it 404s tomorrow we lose every match since 2026-06-02 and, worse, we lose the
# ability to rebuild the ratings that depend on it.
#
# So: fetch both CSVs daily, keep them if they parse and look sane, and push
# them to a Release. Small files (about 450 KB the pair), so a daily copy costs
# nothing and buys the thing we did not have in August.
#
# It deliberately does NOT fail the build when the source is merely stale. The
# source lags 8-14 days by nature - on 2026-09-07 it had no US Open at all,
# mid-tournament - so staleness is normal and only worth a warning. An empty or
# unparseable response IS a failure, because that is the shape of a source
# going away.

on:
  schedule:
    - cron: "20 5 * * *"        # daily, after the source's own overnight update
  workflow_dispatch:

permissions:
  contents: write               # needed to upload Release assets

concurrency:
  group: archive-tennismylife
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG: tennismylife-archive
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          # No `cache: pip` - this repo has no lockfile and setup-python fails
          # the whole job when it cannot find one.

      - name: Install pandas
        run: python -m pip install --quiet pandas

      - name: Fetch and sanity-check both feeds
        id: fetch
        run: |
          python - <<'PY'
          import datetime as _dt, io, json, os, sys, urllib.error, urllib.request
          import pandas as pd

          # The current season's file, by today's date (the year was once
          # hard-coded to 2026). In January the new season's file may not be
          # published yet, or still too small to pass the size check below;
          # then the finished previous season is archived instead, with a
          # warning. Any other 404 fails the job.
          PATTERNS = {"atp": "https://stats.tennismylife.org/data/{year}.csv",
                      "wta": "https://stats.tennismylife.org/data/{year}_wta.csv"}
          UA = {"User-Agent": "dropshotverse/0.1 (non-commercial research)"}
          now = _dt.date.today()

          def fetch(url):
              return urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=60).read()

          summary = {}
          for tour, pattern in PATTERNS.items():
              year = now.year
              url = pattern.format(year=year)
              try:
                  raw = fetch(url)
              except urllib.error.HTTPError as e:
                  if e.code != 404 or now.month != 1:
                      raise
                  raw = b""
              if now.month == 1 and len(raw) < 10_000:
                  print(f"::warning::{tour}: {url} is not published yet or still tiny "
                        f"({len(raw)} bytes); archiving {year - 1} instead")
                  year -= 1
                  url = pattern.format(year=year)
                  raw = fetch(url)
              if len(raw) < 10_000:
                  sys.exit(f"{tour}: {len(raw)} bytes is too small to be the season "
                           f"file; treating as the source going away, not as data")
              d = pd.read_csv(io.BytesIO(raw), low_memory=False)
              need = {"tourney_date", "winner_name", "loser_name", "w_svpt", "w_1stWon"}
              missing = need - set(d.columns)
              if missing:
                  sys.exit(f"{tour}: columns missing {sorted(missing)}; the schema "
                           f"changed and the bridge would break on it")
              dt = pd.to_datetime(d["tourney_date"], format="%Y%m%d", errors="coerce")
              stats = int(d["w_svpt"].notna().sum())
              open(f"tml_{tour}.csv", "wb").write(raw)
              summary[tour] = {"season": year, "rows": len(d), "last_match": str(dt.max().date()),
                               "with_serve_stats": stats, "bytes": len(raw)}
              print(f"{tour}: {len(d):,} rows, last match {dt.max().date()}, "
                    f"{stats:,} with serve stats, {len(raw)/1024:.0f} KB")

          # Staleness is normal here, so it warns rather than fails.
          today = now
          for tour, s in summary.items():
              lag = (today - _dt.date.fromisoformat(s["last_match"])).days
              s["lag_days"] = lag
              if lag > 21:
                  print(f"::warning::{tour} is {lag} days behind - normal lag is "
                        f"8-14 days, so this is worth a look")
          json.dump(summary, open("tml_manifest.json", "w"), indent=1)
          PY

      - name: Publish to the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "tennismylife daily archive" --notes \
              "Daily snapshot of stats.tennismylife.org, the only tour-wide source of serve statistics we have. Kept because Sackmann's repos went 404 mid-project with no warning."
          stamp=$(date -u +%Y%m%d)
          for f in tml_atp.csv tml_wta.csv tml_manifest.json; do
            cp "$f" "${f%.*}_$stamp.${f##*.}"
          done
          # `latest` is overwritten every day; the dated copies accumulate, so a
          # bad upstream day can always be stepped back from.
          gh release upload "$TAG" tml_atp.csv tml_wta.csv tml_manifest.json --clobber
          gh release upload "$TAG" tml_atp_$stamp.csv tml_wta_$stamp.csv tml_manifest_$stamp.json --clobber
          echo "uploaded latest plus dated copies for $stamp"

# Live tournament projection, off the laptop (issue #4).
#
# Rebuilds what DropshotverseUSOpenLiveSim does locally: re-simulate the event
# from the current bracket state and publish live_predictions.parquet and
# pairwise.parquet to R2. Data comes from two Releases (release-as-data-bus):
#   sackmann-archive      the frozen raw archive (publish_archive_release.py)
#   model-inputs-2026-09  Elo replays + the shipped model (publish_model_inputs_release.py)
#
# Runs on Windows because every script hard-codes C:\dev\dropshotverse\...
# A junction at that path pointing at the checkout makes those paths resolve.
# Making the paths relative is the right long-term fix and a separate change;
# doing it mid-event on the files the local task is running from is not.
#
# SCHEDULE IS OFF until CLOUDFLARE_R2_TOKEN and CLOUDFLARE_ACCOUNT_ID exist as
# repo secrets: a scheduled run without them fails at upload every 30 minutes
# and mails Pete each time. Uncomment the cron once they are in. Until then
# workflow_dispatch proves the build end to end (the upload step fails loudly).

name: Live projection

on:
  workflow_dispatch:
    inputs:
      sims:
        description: simulations per tour
        default: "20000"
  # schedule:
  #   - cron: "*/30 * * * *"

concurrency:
  group: live-projection
  cancel-in-progress: false

jobs:
  simulate:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      ARCHIVE_TAG: sackmann-archive
      INPUTS_TAG: model-inputs-2026-09
    steps:
      - uses: actions/checkout@v4

      - name: Junction C:\dev\dropshotverse -> checkout
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:\dev | Out-Null
          New-Item -ItemType Junction -Path C:\dev\dropshotverse -Target $env:GITHUB_WORKSPACE | Out-Null
          Test-Path C:\dev\dropshotverse\dropshotdata\scripts\simulate_usopen_live.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install pandas numpy xgboost pyarrow

      - name: Fetch archive and model inputs from Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dropshotdata/raw dropshotdata/tune_scratch dropshotdata/blog
          gh release download "$ARCHIVE_TAG" --pattern sackmann_archive_raw.tar.gz --dir dropshotdata/raw
          tar -xzf dropshotdata/raw/sackmann_archive_raw.tar.gz -C dropshotdata/raw
          rm dropshotdata/raw/sackmann_archive_raw.tar.gz
          gh release download "$INPUTS_TAG" --dir dropshotdata/tune_scratch
          (cd dropshotdata/tune_scratch && unzip -q xgb_bagged_model_cache_v2_setgame.zip && rm xgb_bagged_model_cache_v2_setgame.zip)
          echo "archive CSVs: $(find dropshotdata/raw/github -name '*.csv' | wc -l)"
          ls -la dropshotdata/tune_scratch dropshotdata/tune_scratch/xgb_bagged_model_cache_v2_setgame
          test "$(find dropshotdata/raw/github -name '*.csv' | wc -l)" -gt 400

      - name: Simulate from the live bracket
        working-directory: dropshotdata/scripts
        run: python simulate_usopen_live.py --sims ${{ github.event.inputs.sims || '20000' }}

      - name: Validate outputs
        shell: bash
        run: |
          ls -la dropshotdata/blog/
          for f in live_predictions.parquet pairwise.parquet; do
            test -f "dropshotdata/blog/$f" || { echo "::error::$f not produced"; exit 1; }
          done
          python dropshotdata/scripts/check_blog_data_freshness.py --path dropshotdata/blog/live_predictions.parquet

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Upload to R2
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_R2_TOKEN / CLOUDFLARE_ACCOUNT_ID not set as repo secrets - build succeeded, nothing published"
            exit 1
          fi
          npm install -g wrangler
          retry_upload() {
            local file="$1" key="$2" attempt=1
            while [ $attempt -le 3 ]; do
              if wrangler r2 object put "$key" --file "$file" --cache-control "public, max-age=300" --remote; then
                return 0
              fi
              echo "::warning::attempt $attempt failed for $key"
              sleep $(( 2 ** attempt )); attempt=$(( attempt + 1 ))
            done
            return 1
          }
          # Only what this run produced. ratings/predictions.parquet are the
          # static pre-tournament tables and stay as published.
          for f in live_predictions.parquet pairwise.parquet; do
            retry_upload "dropshotdata/blog/$f" "inthegame-data/tennis/$f" || { echo "::error::upload failed: $f"; exit 1; }
          done

      - name: Verify the published copy is the one we just built
        shell: bash
        run: python dropshotdata/scripts/check_blog_data_freshness.py --url --max-age-hours 0.5

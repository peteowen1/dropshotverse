name: tests

# The review gate says "open PR, verify CI conclusion, merge". Until now this
# repo had no CI, so that step had nothing to verify and PR #31 merged on local
# evidence alone (D-22). This is what makes the step real.
#
# The suite it runs is deliberately offline and deterministic: the synthetic
# in-progress states are built from a checked-in feed fixture rather than a live
# fetch, and the checks that genuinely need the point tape skip when it is
# absent, since data is not in git. So a red run means the maths changed, not
# that a tournament ended or a network call flaked.

on:
  pull_request:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  in-match-model:
    name: in-match win probability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          # No `cache: pip` - there is no lockfile in this repo, and setup-python
          # fails the whole job when it cannot find one.

      - name: Install the two things the suite actually needs
        run: python -m pip install --quiet numpy pandas

      - name: Recursion, feed parsing and seeding
        run: python dropshotdata/tune_scratch/test_inmatch_seeding.py

  elo-freshness:
    name: stale Elo inputs fail the build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install pandas and pyarrow
        run: python -m pip install --quiet pandas pyarrow

      # OPUS-redteam-2026-10-25 F1: game Elo sat frozen at Roland Garros 2026 beside a
      # current overall Elo for two months. Synthetic files, offline.
      - name: Set/game Elo lagging overall Elo raises
        run: python dropshotdata/tune_scratch/test_elo_freshness.py

  live-score-still-off:
    name: live scoring is off in production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The scheduled task runs the working tree, so a flag turned on here is
      # published within 30 minutes without passing a review. Switching it on is
      # a deliberate act with a checklist in docs/NEXT-STEPS.md, and this makes
      # doing it by accident impossible to merge quietly.
      - name: No producer passes --live-score
        run: |
          set -euo pipefail
          producers="dropshotdata/scripts/refresh_usopen_live.cmd .github/workflows/live-projection.yml"
          if grep -n -- "--live-score" $producers; then
            echo
            echo "A producer passes --live-score."
            echo "That publishes score-conditioned projections within 30 minutes."
            echo "It is intended eventually - see the switch-on checklist in"
            echo "docs/NEXT-STEPS.md - but it must be a deliberate change, so"
            echo "delete this check in the same commit that enables it."
            exit 1
          fi
          echo "Neither producer passes --live-score."
